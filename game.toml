# Castlevania: Circle of the Moon (USA) — static recomp config.
# ROM: AAME (header) / DRACULA AGB1, 8388608 bytes, CRC32 E310970F, SHA1 d661b01eb94186435723ac03344792c11c20c522

[program]
name         = "Castlevania: Circle of the Moon (USA)"
id           = "cotm_usa"
load_address = 0x08000000
size         = 0x00800000
entry_pc     = 0x080000C0

[identity]
sha1   = "d661b01eb94186435723ac03344792c11c20c522"
crc32  = 0xE310970F

[game]
name = "Castlevania: Circle of the Moon (USA)"
rom_sha1 = "d661b01eb94186435723ac03344792c11c20c522"
rom_crc32 = 0xE310970F

[bios]
# Official/open GBA BIOS dump (same hash as the HoD project).
path = "../gbarecomp-cli-windows-x86_64/gbabios/gba_bios.bin"
sha1 = "300c20df6731a33952ded8c436f7f186d25d3492"

[display]
# Native GBA viewport for the first boot milestone.
width = 240
height = 160

[save]
# Circle of the Moon uses SRAM (not Flash / EEPROM).
type = "sram"

# ── Reviewed dispatch-miss proposals (from recomp_master_misses_AAME.toml.frag) ──
# Cart PCs only. BIOS PCs go in bios/gba_bios.toml. IWRAM PCs are runtime-installed
# and stay on the self-heal/interpreter path.

